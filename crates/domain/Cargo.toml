[package]
name = "domain"
edition.workspace = true
version.workspace = true

[dependencies]
base64 = "0.23.1"
blake3 = "1.8.7"
fast_image_resize = { version = "6.1.0", features = ["image"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
infer = "0.22.0"
jiff = "0.2.35"
kamadak-exif = "0.6.1"
rand = "0.10.2"
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite", "runtime-tokio", "macros", "migrate"] }
subtle = "2.6.1"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt"] }
tracing = "0.1.44"
webp = "0.3.1"

[dev-dependencies]
tempfile = "3.27.0"
