<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Cat Diary{% endblock %}</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, sans-serif; line-height: 1.5;
           max-width: 46rem; margin: 0 auto; padding: 1rem; }
    img { max-width: 100%; height: auto; border-radius: 6px; display: block; }
    figure { margin: 0 0 1rem; }
    .entry { padding: 1rem 0; border-bottom: 1px solid rgba(128,128,128,.3); }
    .day { margin-top: 2rem; }
    form { margin: 1rem 0; }
    label { display: block; margin: .5rem 0; }
    input[type=text], input[type=url], textarea, select { width: 100%; }
    .row { display: flex; gap: .5rem; flex-wrap: wrap; }
    .muted { opacity: .7; font-size: .9em; }
  </style>
</head>
<body>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
