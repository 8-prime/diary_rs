<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Cat Diary{% endblock %}</title>
  <style>
    :root {
      color-scheme: light dark;

      /* Every vertical measurement on a sheet is a multiple of this, which is
         what keeps the writing sitting on the lines instead of drifting. */
      --rule: 1.9rem;
      --margin-x: 3.5rem;

      --desk: #e7e1d4;
      --paper: #fdfbf3;
      --rule-line: #cadff0;
      --margin-line: #eba9a9;
      --ink: #2b3a55;
      --ink-faded: #6b7a93;
      --frame: #fffefb;

      /* No webfont: a diary served from your own box should not be fetching
         anything from a font CDN. These are the script faces that ship with
         Windows, macOS and iOS, with the generic as the last resort. */
      --hand: "Segoe Script", "Bradley Hand", "Snell Roundhand", "Noteworthy",
              "Comic Sans MS", "Chalkboard SE", cursive;
      --ui: system-ui, sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --desk: #14161b;
        --paper: #23262e;
        --rule-line: #333c4b;
        --margin-line: #6d4348;
        --ink: #e6e1d5;
        --ink-faded: #9aa3b2;
        --frame: #2c3038;
      }
    }

    body {
      font-family: var(--ui);
      line-height: 1.5;
      max-width: 46rem;
      margin: 0 auto;
      padding: 1rem;
      background: var(--desk);
      color: var(--ink);
    }

    /* ---- a sheet of ruled paper ------------------------------------- */

    .sheet {
      font-family: var(--hand);
      font-size: 1.2rem;
      line-height: var(--rule);
      color: var(--ink);
      background-color: var(--paper);
      /* The line is drawn at the bottom of each band, so it lands under the
         baseline of the text occupying that band. */
      background-image: repeating-linear-gradient(
        to bottom,
        transparent 0,
        transparent calc(var(--rule) - 1px),
        var(--rule-line) calc(var(--rule) - 1px),
        var(--rule-line) var(--rule)
      );
      padding: var(--rule) 1.5rem var(--rule) var(--margin-x);
      margin: 0 0 2rem;
      position: relative;
      border-radius: 2px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, .12), 0 10px 28px rgba(0, 0, 0, .10);
    }

    .sheet::before {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: calc(var(--margin-x) - .9rem);
      border-left: 1px solid var(--margin-line);
    }

    .sheet .date {
      font-size: 1.35rem;
      font-weight: normal;
      line-height: var(--rule);
      margin: 0 0 var(--rule);
      color: var(--ink);
    }

    .sheet .entry {
      margin: 0 0 var(--rule);
      padding: 0;
      border: 0;
    }

    .sheet p {
      margin: 0 0 var(--rule);
      line-height: var(--rule);
    }

    /* ---- photos taped onto the page --------------------------------- */

    /* A fixed, rule-aligned height is what stops a photo of arbitrary size
       from pushing everything below it off the lines. */
    .photo {
      height: calc(var(--rule) * 11);
      margin: 0 0 var(--rule);
      display: flex;
      justify-content: center;
    }

    /* The thumbnail is wrapped in a .zoom element -- a button on the public
       page, a plain span in the admin -- so the print styling hangs off that
       rather than off every img inside a figure. */
    .photo .zoom {
      display: block;
      height: 100%;
      max-width: 100%;
      padding: 0;
      border: 0;
      background: none;
    }

    /* Only the public page's button actually opens anything. */
    .photo button.zoom { cursor: zoom-in; }

    .photo .zoom img {
      height: 100%;
      width: auto;
      max-width: 100%;
      object-fit: contain;
      background: var(--frame);
      padding: .5rem;
      border-radius: 1px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, .2), 0 6px 16px rgba(0, 0, 0, .18);
    }

    /* Rotation is a transform, so it tilts the print without disturbing the
       layout the rules are aligned to. Which of the three a photo gets is
       decided in views.rs from its content hash, so the angle is stable and
       does not shuffle when a neighbouring photo is deleted.

       The three angles are deliberately spread across both directions -- one
       clear left, one clear right, one near-straight. Clustering two of them
       on the same side makes a page of photos all look like they lean the
       same way, which is the opposite of hand-taped. */
    .photo.tilt-0 .zoom img { transform: rotate(  .5deg); }
    .photo.tilt-1 .zoom img { transform: rotate(-1.5deg); }
    .photo.tilt-2 .zoom img { transform: rotate( 1.5deg); }

    /* ---- the photo opened full screen ------------------------------- */

    /* A popover, so the browser handles the top layer, the backdrop and
       Esc-to-close without a line of JavaScript. The UA stylesheet sizes
       [popover] to fit-content and paints it with `background: canvas`, so
       part of this block is undoing that. */
    .lightbox {
      /* The gutter is the clear space around the print; the frame is the
         white border of the print itself. Both are named here because the
         image has to size itself against them -- see .lightbox img. */
      --gutter: clamp(1.75rem, 6vmin, 4rem);
      --frame-width: clamp(.5rem, 1.5vmin, 1rem);

      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      max-width: none;
      max-height: none;
      margin: 0;
      border: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;
    }

    .lightbox::backdrop { background: rgba(0, 0, 0, .82); }

    /* The whole surface dismisses: tap the print, tap beside it, or
       hit Esc. Light dismiss alone would not be enough -- the popover fills
       the viewport, so there is no "outside" left to click. */
    .lightbox .zoom-out {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      padding: var(--gutter);
      border: 0;
      background: none;
      cursor: zoom-out;
    }

    /* The print: a white border and a shadow that sits it off the board. */
    .lightbox .pinned {
      position: relative;
      display: block;
      padding: var(--frame-width);
      background: var(--frame);
      border-radius: 1px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, .35);
    }

    /* Pinned prints hang slightly askew. Reusing the per-photo tilt classes
       means a photo keeps its own angle when opened -- the popover is still a
       DOM descendant of the figure, so these ancestor selectors match even
       though it renders in the top layer. Halved, because an angle that reads
       as casual at thumbnail size wastes real space at full screen. */
    .photo.tilt-0 .pinned { transform: rotate(  .25deg); }
    .photo.tilt-1 .pinned { transform: rotate(-.75deg); }
    .photo.tilt-2 .pinned { transform: rotate( .75deg); }

    /* The pushpin, pressed through the top edge of the print. The first
       gradient is the highlight on the dome, the second the body. */
    .lightbox .pinned::after {
      content: "";
      position: absolute;
      left: 50%;
      top: calc(var(--frame-width) * -.5 - .35rem);
      width: clamp(1.1rem, 3.2vmin, 1.7rem);
      aspect-ratio: 1;
      transform: translateX(-50%);
      border-radius: 50%;
      background:
        radial-gradient(circle at 34% 28%, rgba(255, 255, 255, .95) 0 9%, rgba(255, 255, 255, .5) 16%, transparent 46%),
        radial-gradient(circle at 50% 44%, #e2564d 0 40%, #a8231f 76%, #74110f);
      box-shadow:
        0 2px 3px rgba(0, 0, 0, .5),
        inset 0 -2px 3px rgba(0, 0, 0, .35);
    }

    .lightbox img {
      display: block;
      width: auto;
      height: auto;
      /* Sized against the viewport rather than the parent: a percentage
         max-height inside an auto-height wrapper is indeterminate, so the
         image would not shrink to fit a short window. */
      max-width: calc(100vw - (var(--gutter) + var(--frame-width)) * 2);
      max-height: calc(100dvh - (var(--gutter) + var(--frame-width)) * 2);
      object-fit: contain;
      /* None of the thumbnail's taped-print treatment applies here -- the
         frame and shadow moved out to .pinned. */
      transform: none;
      padding: 0;
      background: none;
      box-shadow: none;
    }

    @media (prefers-reduced-motion: no-preference) {
      /* `allow-discrete` is what lets display and overlay animate, so the
         popover can fade instead of appearing instantly. */
      .lightbox, .lightbox::backdrop {
        opacity: 0;
        transition: opacity .18s ease, display .18s allow-discrete, overlay .18s allow-discrete;
      }

      .lightbox:popover-open, .lightbox:popover-open::backdrop { opacity: 1; }

      @starting-style {
        .lightbox:popover-open, .lightbox:popover-open::backdrop { opacity: 0; }
      }
    }

    /* ---- masthead and plain UI -------------------------------------- */

    .masthead { margin: 1rem 0 2rem; text-align: center; }
    .masthead h1 { font-family: var(--hand); font-weight: normal; margin: 0; }
    .masthead .subtitle { font-family: var(--hand); color: var(--ink-faded); margin: .25rem 0 0; }

    h1, h2, h3 { line-height: 1.3; }
    a { color: inherit; }

    form { margin: 1rem 0; }
    label { display: block; margin: .5rem 0; }
    input[type=text], input[type=password], input[type=url], textarea, select { width: 100%; }
    button, input, textarea, select { font-family: var(--ui); font-size: 1rem; }
    .row { display: flex; gap: .5rem; flex-wrap: wrap; }
    .muted { opacity: .7; font-size: .9em; font-family: var(--ui); }

    /* Admin panels stay plain paper-white so the forms are legible. */
    .panel {
      background: var(--paper);
      border-radius: 2px;
      padding: 1rem 1.25rem;
      margin: 0 0 1.5rem;
      box-shadow: 0 1px 2px rgba(0, 0, 0, .12);
    }
  </style>
</head>
<body>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
