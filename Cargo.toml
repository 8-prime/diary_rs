[workspace]
resolver = "3"
members = ["crates/server", "crates/domain"]

[workspace.package]
edition = "2024"
version = "0.1.0"

# Our own crates stay unoptimised so backtraces and stepping still work, but
# the image pipeline is unusable otherwise: a phone photo takes ~27s through a
# debug-built resizer and under 2s through an optimised one.
[profile.dev.package."*"]
opt-level = 3

# `fast_image_resize` is generic, so its hot loops are monomorphised into
# whichever crate calls them -- leaving domain unoptimised keeps the resize
# slow no matter what the dependencies are built at.
[profile.dev.package.domain]
opt-level = 3
